name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+**' # Matches release tags of the form major.minor.patch, e.g. v1.2.1
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

# Cancel superseded PR runs; never cancel main/tag runs (releases)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # 4 cpu, 16G ram
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4
    outputs:
      publish-version: ${{ steps.project-version.outputs.publish-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java and Gradle
        id: setup-java-gradle
        uses: Consensys-Incorporated/github-actions/java-setup-gradle@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          DISTRIBUTION: 'adopt'
          VERSION: '25'

      - name: Determine Shomei version
        id: project-version
        uses: Consensys-Incorporated/github-actions/java-get-project-version@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0

      # compiles, runs the unit tests and assembles the distributions
      - name: Build
        run: ./gradlew build

      - name: Store distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: build/distributions/
          retention-days: 3
          if-no-files-found: error

  publishMavenCentral:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    # 4 cpu, 16G ram
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    # JReleaser skips the GitHub release and tag (build.gradle), so no write access is needed.
    # No id-token here: only dockerPublish may request a Docker Hub OIDC token.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Java and Gradle
        id: setup-java-gradle
        uses: Consensys-Incorporated/github-actions/java-setup-gradle@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          DISTRIBUTION: 'adopt'
          VERSION: '25'

      - name: Publish on maven central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GITHUB_USERNAME: ${{ github.actor }}
          JRELEASER_GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_NEXUS2_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          BUILD_RELEASE: true
          TAG_VERSION: ${{ needs.build.outputs.publish-version }}
        run: |
          ./gradlew clean assemble publish jreleaserFullRelease

  dockerTests:
    needs: build
    # 4 cpu, 16G ram
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # required for Trivy SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: build/distributions/

      - name: Docker Metadata
        id: docker-metadata
        uses: Consensys-Incorporated/github-actions/java-docker-metadata@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          publish-version: ${{ needs.build.outputs.publish-version }}
          docker-repo: "consensys/linea-shomei"

      - name: Build and export to docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          file: docker/Dockerfile
          context: .
          build-args: |
            TAR_FILE=./build/distributions/shomei-${{ needs.build.outputs.publish-version }}.tar.gz
            BUILD_DATE=${{ steps.docker-metadata.outputs.build-date }}
            VCS_REF=${{ steps.docker-metadata.outputs.vcs-ref }}
            VERSION=${{ needs.build.outputs.publish-version }}
          no-cache: true
          load: true
          tags: consensys/linea-shomei:test

      - name: Run Docker tests
        run: ./docker/test.sh 'consensys/linea-shomei:test' 

      - name: Test Summary
        if: always()
        run: |
          {
            echo "<h2>Docker Test Summary</h2>"
            echo "<details><summary><strong>Details</strong></summary>"
            echo "<pre><code>"
            # escape the XML so it renders as text, and tolerate missing reports
            cat ./docker/reports/*.xml 2>/dev/null \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              || true
            echo "</code></pre></details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Trivy vulnerability scanner
        if: false  # TEMPORARY: Disabled due to Aqua Security breach — re-enable once resolved
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'consensys/linea-shomei:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: false  # TEMPORARY: Disabled due to Aqua Security breach — re-enable once resolved (used to be always())
        with:
          sarif_file: 'trivy-results.sarif'

  dockerPublish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - dockerTests
    # 4 cpu, 16G ram
    runs-on: ubuntu-24.04
    # Docker Hub trusts OIDC tokens from this environment only
    environment: publish
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: build/distributions/

      - name: Docker Metadata
        id: docker-metadata
        uses: Consensys-Incorporated/github-actions/java-docker-metadata@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          publish-version: ${{ needs.build.outputs.publish-version }}
          docker-repo: "consensys/linea-shomei"

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.docker-metadata.outputs.push == 'true'
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: 600 # the whole job takes about 3 minutes
        with:
          username: consensys

      - name: Build and push to registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.docker-metadata.outputs.push == 'true'
        with:
          platforms: linux/amd64,linux/arm64
          file: docker/Dockerfile
          context: .
          build-args: |
            TAR_FILE=./build/distributions/shomei-${{ needs.build.outputs.publish-version }}.tar.gz
            BUILD_DATE=${{ steps.docker-metadata.outputs.build-date }}
            VCS_REF=${{ steps.docker-metadata.outputs.vcs-ref }}
            VERSION=${{ needs.build.outputs.publish-version }}
          push: ${{ steps.docker-metadata.outputs.push }}
          tags: ${{ steps.docker-metadata.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - publishMavenCentral
      - dockerTests
      - dockerPublish
    permissions:
        contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: build/distributions/

      - name: Generate Checksum
        working-directory: ./build/distributions
        run: |
          shasum -a 256 "shomei-${{ needs.build.outputs.publish-version }}.tar.gz" > "shomei-${{ needs.build.outputs.publish-version }}.tar.gz.sha256"
          shasum -a 256 "shomei-${{ needs.build.outputs.publish-version }}.zip" > "shomei-${{ needs.build.outputs.publish-version }}.zip.sha256"

      - name: Determine Prerelease
        id: determine-prerelease
        run: |
          if [[ "${{ needs.build.outputs.publish-version }}" == *-RC* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      
      # Create release tag and attach the distribution
      - name: Shomei Release
        id: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            build/distributions/shomei-${{ needs.build.outputs.publish-version }}.tar.gz
            build/distributions/shomei-${{ needs.build.outputs.publish-version }}.tar.gz.sha256
            build/distributions/shomei-${{ needs.build.outputs.publish-version }}.zip
            build/distributions/shomei-${{ needs.build.outputs.publish-version }}.zip.sha256

          tag_name: ${{ needs.build.outputs.publish-version }}
          body: |
            # Shomei Release
            ### Additions and Improvements
            ### Bug Fixes            
          draft: true
          prerelease: ${{ steps.determine-prerelease.outputs.prerelease }}
          preserve_order: true
